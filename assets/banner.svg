<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Animated Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#ec4899;#a855f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#3b82f6;#06b6d4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .float-shape {
      animation: float 5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.4; }
      100% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="1020" cy="180" r="140" fill="#6366f1" opacity="0.18" filter="url(#soft-glow)" class="pulse-circle" />
  <circle cx="180" cy="120" r="100" fill="#ec4899" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.12" filter="url(#soft-glow)" />

  <!-- Animated Play Icon Graphic Frame -->
  <g transform="translate(940, 95)" class="float-shape">
    <!-- Outer Glowing Hexagon / Rounded Card -->
    <rect x="0" y="0" width="170" height="170" rx="36" fill="#1e1b4b" fill-opacity="0.6" stroke="url(#accent-grad)" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Video Stream Waves -->
    <path d="M 30,125 Q 50,105 70,125 T 110,125 T 145,125" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;50" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Central Play Triangle -->
    <polygon points="68,55 120,85 68,115" fill="url(#accent-grad)" filter="url(#glow)"/>
    
    <!-- Live Indicator Dot -->
    <circle cx="135" cy="35" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Streaming Signal Waves -->
  <g transform="translate(820, 140)" opacity="0.7">
    <path d="M 0,40 Q 30,10 60,40 T 120,40" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0,20 Q 30,-10 60,20 T 120,20" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(70, 75)">
    <!-- Curated Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="#312e81" fill-opacity="0.8" stroke="url(#accent-grad)" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#10b981"/>
      <text x="30" y="20" class="badge-text">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="80" class="title">
      <tspan fill="url(#text-grad)">Awesome </tspan>
      <tspan fill="url(#accent-grad)" filter="url(#glow)">Video Hosting</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="125" class="subtitle">
      The definitive guide to SaaS platforms &amp; open-source video infrastructure
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="21" class="badge-text">⚡ Live &amp; VOD</text>

      <rect x="145" y="0" width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="159" y="21" class="badge-text">🚀 WebRTC &amp; HLS</text>

      <rect x="300" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="314" y="21" class="badge-text">🛠️ Transcoding APIs</text>

      <rect x="475" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="489" y="21" class="badge-text">💰 Pricing Matrix</text>
    </g>
  </g>

  <!-- Bottom Accent Border Strip -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accent-grad)"/>
</svg>
